# Extra system libraries needed at runtime by the `canvas` npm package (used
# by chartjs-node-canvas to render the member-comparison graph). Without
# these, Railway's default Nixpacks image is missing shared libraries that
# canvas's native binary dlopen()s at require() time, crashing the whole bot
# on startup with ERR_DLOPEN_FAILED even though `npm install` succeeds fine.
#
# IMPORTANT: all of cairo's own dependencies (freetype, fontconfig, pixman,
# harfbuzz) are listed explicitly here too, sourced from Nix rather than left
# to resolve against whatever the base image happens to have. Mixing an
# apt-installed cairo with a system freetype (or vice versa) caused a
# separate crash — "undefined symbol: FT_Get_Transform" — because the two
# were built against incompatible versions of each other. Getting the whole
# dependency chain from ONE package source (Nix, via nixLibs) avoids that
# ABI mismatch. nixLibs is Nixpacks' documented mechanism for "install this
# Nix package AND add its library path to LD_LIBRARY_PATH automatically"
# (see https://nixpacks.com/docs/configuration/file).
[phases.setup]
nixLibs = [
  "util-linux",
  "cairo",
  "pango",
  "libjpeg",
  "giflib",
  "librsvg",
  "freetype",
  "fontconfig",
  "pixman",
  "harfbuzz"
]
